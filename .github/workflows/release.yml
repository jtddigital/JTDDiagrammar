name: Release

# URS-NF-012: a v* tag publishes the app bundle, its checksum and the installers.
# If the release already exists (e.g. drafted on the releases page), the files are attached to it.
# "Run workflow" builds the given tag; if the tag does not exist yet, it is created on the commit
# the run was started from (normally main).
# URS-NF-014: every push to main (a merged PR) publishes the next patch version, unless the commit
# already has a version tag or its message contains [skip release].
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, e.g. v1.2.3. Created on the selected branch if it does not exist.
        required: true

permissions:
  contents: write

# One release at a time, so two quick merges cannot pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Choose the version
        id: pick
        env:
          SKIP: ${{ contains(github.event.head_commit.message, '[skip release]') }}
        run: |
          if [ "${{ github.event_name }}" != push ] || [ "${{ github.ref_type }}" != branch ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tags=$(gh api --paginate "repos/${{ github.repository }}/tags" --jq '.[] | select(.name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | "\(.name) \(.commit.sha)"')
          if [ "$SKIP" = true ] || grep -q " ${{ github.sha }}$" <<< "$tags"; then
            echo "::notice::no release: [skip release], or this commit already has a version tag"; exit 0
          fi
          latest=$(cut -d' ' -f1 <<< "$tags" | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
          echo "tag=v$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag must look like v1.2.3, got '$TAG'"; exit 1; }
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::tag $TAG does not exist; it will be created on ${{ github.sha }}"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "create=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm release:pack "$TAG"
      - name: Attach to the release, creating the release (and tag) if needed
        env:
          CREATE_TAG: ${{ steps.tag.outputs.create }}
        run: |
          cd dist-release
          files=(jtddiagrammar.tar.gz jtddiagrammar.tar.gz.sha256 install.sh install.ps1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          elif [ -n "$CREATE_TAG" ]; then
            gh release create "$TAG" "${files[@]}" --title "JTDDiagrammar $TAG" --generate-notes --target "${{ github.sha }}"
          else
            gh release create "$TAG" "${files[@]}" --title "JTDDiagrammar $TAG" --generate-notes --verify-tag
          fi
