name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  commits:
    # URS-NF-004: every pushed commit carries an impact assessment.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/ci/commits.ts "${{ github.event.before }}" "${{ github.sha }}"

  e2e:
    # Web app against the real API (URS-WEB-001..004, URS-LY-009 in a browser); SVGs in Chromium and Firefox (URS-RN-001).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jtd/web exec playwright install --with-deps chromium firefox
      - run: pnpm e2e

  docker:
    # URS-NF-006: the image builds and serves both the API and the web app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jtd .
      - run: |
          docker run -d --name jtd -p 8080:8080 jtd
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          curl -sf -X POST -H 'content-type: application/json' \
            --data '{"version":"1","type":"flowchart","nodes":[{"id":"a"}]}' localhost:8080/v1/render | grep -q '<svg'
          # No Anthropic key: Claude is off; Copilot is on by default and needs no secret (URS-API-015, URS-AI-024).
          ai="$(curl -sf localhost:8080/v1/ai)"
          echo "$ai" | grep -q '"id":"copilot"'
          if echo "$ai" | grep -q '"id":"claude"'; then echo "Claude enabled without a key" >&2; exit 1; fi

  install:
    # URS-NF-010/011/013: install a packed release from a stand-in GitHub API, launch it, update, uninstall.
    # Windows first: both Windows PowerShell 5.1 (what users have) and PowerShell 7. Linux runs install.sh.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, ps: powershell }
          - { os: windows-latest, ps: pwsh }
          - { os: ubuntu-latest, ps: '' }
          # PowerShell 7 passing native arguments the way 5.1 does (quotes stripped).
          - { os: ubuntu-latest, ps: pwsh, legacy: '1' }
    name: install (${{ matrix.os }} ${{ matrix.ps || 'bash' }}${{ matrix.legacy && ' legacy' || '' }})
    runs-on: ${{ matrix.os }}
    env:
      JTD_E2E_PS: ${{ matrix.ps }}
      JTD_E2E_LEGACY: ${{ matrix.legacy }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:e2e

  secrets:
    # URS-NF-008
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source /repo --no-banner --redact
